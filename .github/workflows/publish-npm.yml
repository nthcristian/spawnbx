name: Publish to npm

on:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-publish-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: NPM_PUBLISH
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Bump version if already published
        run: |
          set -eu
          version="$(node -p "require('./package.json').version")"
          latest="$(npm view spawnbx version 2>/dev/null || echo "none")"
          if [ "$latest" = "none" ]; then
            echo "Package not yet published; publishing $version as-is."
          else
            is_newer="$(node -e "
              const [a,b,c] = '$version'.split('.').map(Number);
              const [x,y,z] = '$latest'.split('.').map(Number);
              console.log(a>x || (a===x && b>y) || (a===x && b===y && c>z) ? 'yes' : 'no')
            ")"
            if [ "$is_newer" = "yes" ]; then
              echo "Local $version is newer than published $latest; publishing as-is."
            else
              echo "Local $version is not newer than published $latest; bumping patch."
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git config user.name "github-actions[bot]"
              npm version patch -m "chore: bump version to %s [skip ci]"
              git push origin HEAD:main --follow-tags
            fi
          fi
          node -p '"Publishing spawnbx@" + require("./package.json").version'

      - name: Build binary
        run: cargo build --locked --release

      - name: Prepare npm package
        run: |
          set -eu
          mkdir -p bin
          cp target/release/spawnbx bin/spawnbx
          chmod 755 bin/spawnbx

      - name: Validate package contents
        run: npm pack --dry-run

      - name: Publish to npm
        run: npm publish --provenance --access public
