name: Publish to npm

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: NPM_PUBLISH
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Bump version if already published
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          LATEST=$(npm view spawnbx version 2>/dev/null || echo "none")

          if [ "$LATEST" = "none" ]; then
            echo "Package not yet published — publishing $VERSION as-is."
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "bumped=false" >> $GITHUB_OUTPUT
          else
            IS_NEWER=$(node -e "
              const [a,b,c] = '$VERSION'.split('.').map(Number);
              const [x,y,z] = '$LATEST'.split('.').map(Number);
              console.log(a>x || (a===x && b>y) || (a===x && b===y && c>z) ? 'yes' : 'no')
            ")
            if [ "$IS_NEWER" = "yes" ]; then
              echo "Local $VERSION > published $LATEST — publishing as-is."
              echo "version=$VERSION" >> $GITHUB_OUTPUT
              echo "bumped=false" >> $GITHUB_OUTPUT
            else
              echo "Local $VERSION ≤ published $LATEST — bumping patch..."
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git config user.name "github-actions[bot]"
              npm version patch -m "chore: bump version to %s"
              git push --follow-tags
              NEW_VERSION=$(node -p "require('./package.json').version")
              echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
              echo "bumped=true" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Publish to npm
        run: npm publish

      - name: Create GitHub Release
        if: steps.version.outputs.bumped == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
